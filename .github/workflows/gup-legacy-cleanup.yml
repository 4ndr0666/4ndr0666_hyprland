name: GUP legacy cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy overlay implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/lib_copy.sh')
          text = path.read_text()
          pattern = re.compile(r'\ncompose_overlay_from_backup\(\) \{.*?\n\}\n\n(?=cleanup_duplicate_userconfigs\(\))', re.S)
          updated, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy overlay block, removed {count}')
          path.write_text(updated)
          PY

      - name: Verify duplicate definitions are absent
        shell: bash
        run: |
          set -Eeuo pipefail
          count="$(grep -RhoE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*\(\)[[:space:]]*\{' scripts --include='*.sh' | sort | uniq -d | wc -l)"
          if [[ "$count" -ne 0 ]]; then
            echo '[ERROR] Duplicate shell function definitions remain.' >&2
            grep -RhoE '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*\(\)[[:space:]]*\{' scripts --include='*.sh' | sort | uniq -d >&2
            exit 1
          fi

      - name: Syntax check shell sources
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            if [[ "$file" == config/hypr/scripts/RofiEmoji.sh ]]; then
              tmp="$(mktemp)"
              trap 'rm -f -- "$tmp"' RETURN
              sed '/^# # DATA # #$/q' "$file" >"$tmp"
              bash -n "$tmp"
              rm -f -- "$tmp"
              trap - RETURN
            else
              bash -n "$file"
            fi
          done < <(find scripts install-scripts config/hypr/scripts -type f -name '*.sh' -print0)

      - name: Run overlay regression
        shell: bash
        run: tests/unit/test-overlay-composition-error-semantics.sh

      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- scripts/lib_copy.sh; then
            echo '[INFO] Legacy overlay implementation already absent.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lib_copy.sh
          git commit -m 'fix(gup): remove duplicate legacy overlay implementation'
          git push
