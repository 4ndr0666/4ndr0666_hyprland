name: Golden Unit Protocol

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'audit/**'
      - 'gup/**'
  pull_request:

permissions:
  contents: read

jobs:
  golden-units:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run complete Golden Unit suite
        run: bash tests/unit/run-golden-units.sh
