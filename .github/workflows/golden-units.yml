name: Golden Unit Protocol

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'audit/**'
      - 'gup/**'
  pull_request:

permissions:
  contents: read

jobs:
  golden-units:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua syntax parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
      - name: Run complete Golden Unit suite
        run: bash tests/unit/run-golden-units.sh
