name: Golden Unit Protocol

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'audit/**'
      - 'gup/**'
  pull_request:

permissions:
  contents: read

jobs:
  golden-units:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run complete Golden Unit suite
        run: bash tests/unit/run-golden-units.sh
