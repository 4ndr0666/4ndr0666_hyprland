name: Arch Pi image builder

on:
  push:
    branches: [main, 'tooling/**']
    paths:
      - install_arch-pi4.sh
      - scripts/pi-*.py
      - tests/pi-image/**
      - .github/workflows/pi-image-builder.yml
  pull_request:
    paths:
      - install_arch-pi4.sh
      - scripts/pi-*.py
      - tests/pi-image/**
      - .github/workflows/pi-image-builder.yml

permissions:
  contents: read

jobs:
  non-destructive-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Bash syntax
        run: bash -n install_arch-pi4.sh
      - name: Image logic and local Git fixtures (no block devices)
        run: python3 -B -m unittest discover -s tests/pi-image -p 'test_*.py' -v
