name: GUP surgical refactor

on:
  push:
    branches:
      - gup/copy-phase1-transactional

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor copy_phase1 transaction boundary
        env:
          PYTHONUTF8: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/lib_copy.sh')
          text = path.read_text()
          old = '''          BACKUP_DIR=$(get_backup_dirname)
          mv "$DIRPATH" "$DIRPATH-backup-$BACKUP_DIR" 2>&1 | tee -a "$log"
          echo -e "${NOTE:-[NOTE]} - Backed up $DIR2 to $DIRPATH-backup-$BACKUP_DIR." 2>&1 | tee -a "$log"
          cp -r "config/$DIR2" "$HOME/.config/$DIR2" 2>&1 | tee -a "$log"
          echo -e "${OK:-[OK]} - Replaced $DIR2 with new configuration." 2>&1 | tee -a "$log"
          if [ "$DIR2" = "rofi" ]; then
            if [ -d "$DIRPATH-backup-$BACKUP_DIR/themes" ]; then
              for file in "$DIRPATH-backup-$BACKUP_DIR/themes"/*; do
                [ -e "$file" ] || continue
                cp -n "$file" "$HOME/.config/rofi/themes/" >>"$log" 2>&1 || true
              done || true
            fi
            if [ -f "$DIRPATH-backup-$BACKUP_DIR/0-shared-fonts.rasi" ]; then
              cp "$DIRPATH-backup-$BACKUP_DIR/0-shared-fonts.rasi" "$HOME/.config/rofi/0-shared-fonts.rasi" >>"$log" 2>&1
            fi
          fi
'''
          new = '''          BACKUP_DIR=$(replace_dir_transaction "config/$DIR2" "$DIRPATH" "$log")
          if [ -n "$BACKUP_DIR" ]; then
            echo -e "${NOTE:-[NOTE]} - Backed up $DIR2 to $BACKUP_DIR." 2>&1 | tee -a "$log"
          fi
          echo -e "${OK:-[OK]} - Replaced $DIR2 with new configuration." 2>&1 | tee -a "$log"
          if [ "$DIR2" = "rofi" ] && [ -n "$BACKUP_DIR" ]; then
            if [ -d "$BACKUP_DIR/themes" ]; then
              for file in "$BACKUP_DIR/themes"/*; do
                [ -e "$file" ] || continue
                cp -n "$file" "$HOME/.config/rofi/themes/" >>"$log" 2>&1 || true
              done || true
            fi
            if [ -f "$BACKUP_DIR/0-shared-fonts.rasi" ]; then
              cp "$BACKUP_DIR/0-shared-fonts.rasi" "$HOME/.config/rofi/0-shared-fonts.rasi" >>"$log" 2>&1
            fi
          fi
'''
          if old not in text:
              raise SystemExit('expected copy_phase1 block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot refactor workflow
        run: rm -f .github/workflows/gup-surgical-refactor.yml
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/lib_copy.sh .github/workflows/gup-surgical-refactor.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(gup): make copy phase1 transactional"
          git push origin HEAD:gup/copy-phase1-transactional
